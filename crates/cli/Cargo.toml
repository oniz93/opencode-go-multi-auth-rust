[package]
name = "ocrouter-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "ocrouter_cli"
path = "src/lib.rs"

[[bin]]
name = "ocrouter"
path = "src/main.rs"

[dependencies]
ocrouter-core = { path = "../core" }
anyhow = "1.0.104"
bytes = "1.12.2"
futures-util = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.3"
hyper = { version = "1.10.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "http1"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
axum = { version = "0.8.9", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
