[package]
name = "ocrouter-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.98"

[lib]
name = "ocrouter_gui"
path = "src/lib.rs"

[[bin]]
name = "ocrouter-gui"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.10.0"
smol = "2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "blocking"] }
serde_json = "1.0.154"
